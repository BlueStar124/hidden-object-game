name: CI

on:
  push:
    branches: [main, react-native, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (rules, saved progress, page content)
        run: npm test

      - name: Architecture (layers of app/src)
        run: npm run check:architecture

      - name: Supabase catalog (every page and sprite is known to the backend's challenge rules)
        run: node ../tools/check-supabase-catalog.mjs

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Build web
        run: npm run build:web

      # Playwright comes from the repo root (the tools' package). Roboto: the system font of
      # Android phones, which the web app's labels then use, as they would on one
      - name: Install Playwright and fonts
        working-directory: .
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-roboto

      - name: Screen sizes (every dialog and the game, on phones either way up, tablets, computers)
        run: npm run test:screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: scratch/screens
          if-no-files-found: ignore

  # The database follows the code: once every check has passed on main, the migrations in
  # supabase/migrations that the project does not have yet are applied (already applied ones are
  # skipped, so a push without a new migration changes nothing). Secrets: Settings → Secrets and
  # variables → Actions — SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens),
  # SUPABASE_DB_PASSWORD (the database password) and SUPABASE_PROJECT_ID (the project's reference).
  migrate:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply new migrations
        run: supabase db push
