name: CI

on:
  push:
    branches: [main, react-native, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (rules, saved progress, page content)
        run: npm test

      - name: Architecture (layers of app/src)
        run: npm run check:architecture

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Build web
        run: npm run build:web
